[package]
name = "fractal-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
fractal-core = { version = "0.1.0", path = "../fractal-core" }
fuzzy-matcher = "0.3.7"
notify = "8.2.1"
open = "5.4.5"
portable-pty = "0.9.0"
regex = "1.13.1"
resvg = "0.49.0"
rfd = "0.17.2"
trash = "5.3.0"
vt100 = "0.18.1"
